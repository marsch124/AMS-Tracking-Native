<title>Tracking Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Tracking Tour: chapter rail on the left, coach card + a pretend iPhone on the right. Same engine as the other AMS tours.
   Based on AMS Workouts (WorkoutCompanion) 1.21 (build 1). Update this tour in the release that changes a taught screen. */
:root {
  --bg: #F4F6F7; --panel: #FFFFFF; --fg: #16232A; --muted: #5F7078; --line: #E2E8EA;
  --accent: #3B70F0; --accent-soft: #E6EDFD; --good: #15803D; --good-soft: #E3F4E8; --warn: #C2410C;
  --shadow: 0 18px 40px rgba(22,35,42,.2);
  --pbg:#F4F6F7; --pcard:#FFFFFF; --pink:#16232A; --pmuted:#5F7078; --pline:#E2E8EA; --pfield:rgba(120,120,128,.14);
  --ind:#3B70F0; --gt:#3B70F0; --band:#1E1B4B; --bz:#FF8C1A; --bz-ink:#4A2300; --bzt:#C2410C;
  --plum:#9C3D8C; --plumt:#9C3D8C; --navy:#2A5194; --grn:#30D158; --grn-ink:#0B3A17; --sess:#15803D;
  --yel:#FFD60A; --yel-ink:#3D3000; --wut:#A16207; --gold:#B7791F; --acc:#2F6FE0; --red:#DC3D43; --blue:#0A84FF; --pink2:#FF6FA8; --pink2-ink:#5A0F2E;
  --f-display: "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-phone: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0E1416; --panel:#161F22; --fg:#E7EDEE; --muted:#94A6AC; --line:#26343A;
  --accent:#8FB0FF; --accent-soft:#1B2A4D; --good:#86EFAC; --good-soft:#15301F; --warn:#FDBA74;
  --shadow: 0 18px 40px rgba(0,0,0,.55);
  --pbg:#0E1416; --pcard:#161F22; --pink:#E7EDEE; --pmuted:#94A6AC; --pline:#26343A; --pfield:rgba(120,120,128,.3);
  --gt:#8FB0FF; --bzt:#FDBA74; --plumt:#E29BD6; --sess:#86EFAC; --wut:#FCD34D; --gold:#F6C453;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg:#0E1416; --panel:#161F22; --fg:#E7EDEE; --muted:#94A6AC; --line:#26343A;
  --accent:#8FB0FF; --accent-soft:#1B2A4D; --good:#86EFAC; --good-soft:#15301F; --warn:#FDBA74;
  --shadow: 0 18px 40px rgba(0,0,0,.55);
  --pbg:#0E1416; --pcard:#161F22; --pink:#E7EDEE; --pmuted:#94A6AC; --pline:#26343A; --pfield:rgba(120,120,128,.3);
  --gt:#8FB0FF; --bzt:#FDBA74; --plumt:#E29BD6; --sess:#86EFAC; --wut:#FCD34D; --gold:#F6C453;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; margin: 0 }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 22px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }
svg.g { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }

/* Rail */
.rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.brand h1 { font-family: var(--f-display); font-size: 19px; line-height: 1.1; margin: 0; text-wrap: balance }
.brand small { color: var(--muted); font-size: 12px }
.logo { width: 40px; height: 40px; border-radius: 10px; background: #3B70F0; color: #fff; display: grid; place-items: center; flex: none }
.chap { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; border: 0; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.chap:hover { background: var(--accent-soft) }
.chap:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chap .n { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap }
.chap.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.chap.done .n { color: var(--good) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 10px 2px 2px }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s }
.railnote { color: var(--muted); font-size: 12px; margin: 4px 2px }

/* Coach */
.main { display: grid; grid-template-columns: minmax(0,1fr); gap: 14px; min-width: 0; align-content: start }
.topnote { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13.5px }
.coach { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: center; }
.coach .eyebrow { grid-column: 1 / -1; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; display: flex; gap: 8px; align-items: center }
.coach .eyebrow .kind { color: var(--muted); font-weight: 500 }
.coach h2 { font-family: var(--f-display); font-size: 23px; line-height: 1.2; margin: 0; text-wrap: balance }
.coach p { margin: 4px 0 0; color: var(--fg); max-width: 62ch }
.coach .btns { display: flex; gap: 8px; align-items: center }
.btn { font: inherit; font-weight: 600; border-radius: 9px; padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.btn.main-b { background: #3B70F0; border-color: #3B70F0; color: #fff }
.btn.main-b:disabled { opacity: .45; cursor: default }
.btn.ghost { border-color: transparent; color: var(--muted) }
.answers { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px }
.ans { font: inherit; padding: 8px 14px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; text-align: left }
.ans:hover { border-color: var(--accent) }
.ans.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600 }
.ans.wrong { border-color: var(--warn); color: var(--warn); text-decoration: line-through }
.feedback { grid-column: 1 / -1; font-weight: 600; color: var(--good); min-height: 1.4em; margin: 0 }
.feedback.no { color: var(--warn) }

/* Stage = pretend iPhone, 390 x 760, scaled to fit */
.stagebox { position: relative; width: min(100%, 390px); aspect-ratio: 390 / 760; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 6px #1f1f23, var(--shadow); justify-self: center; background: var(--pbg) }
.stage { position: absolute; left: 0; top: 0; width: 390px; height: 760px; transform-origin: 0 0; font-family: var(--f-phone); font-size: 15px; line-height: 1.3; color: var(--pink); background: var(--pbg); overflow: hidden; -webkit-user-select: none; user-select: none }
:where(.stage button) { font: inherit; color: inherit }
:where(.stage input) { font: inherit; color: var(--pink); -webkit-user-select: text; user-select: text }
/* ---- The pretend iPhone: AMS Tracking 2.0. Every class here starts with tk- ---- */
:root { --pbg:#f2f4f8; --pcard:#ffffff; --pink:#16181d; --pmuted:#656d7a; --pline:rgba(0,0,0,.07); --pfield:rgba(120,120,128,.14);
  --ac:#3b70f0; --gr:#2fa96d; --rd:#d9463e; --am:#e0a80f; --dg:#e5484d; --stale:#7a5b06; --chart:#24925c; --gold:#c9a227; --tkundo:#7ea4f7; --tkshadow:rgba(20,30,60,.07) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --pbg:#0d1117; --pcard:#161b26; --pink:#eceef2; --pmuted:#8d93a1; --pline:rgba(255,255,255,.08); --stale:#e0a80f; --chart:#2fa96d; --tkundo:#2c5fd8; --tkshadow:rgba(0,0,0,.35) } }
:root[data-theme="dark"] { --pbg:#0d1117; --pcard:#161b26; --pink:#eceef2; --pmuted:#8d93a1; --pline:rgba(255,255,255,.08); --stale:#e0a80f; --chart:#2fa96d; --tkundo:#2c5fd8; --tkshadow:rgba(0,0,0,.35) }

.tk-sbar { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 6px 34px; font-weight: 600; font-size: 15px; z-index: 40; pointer-events: none; background: linear-gradient(var(--pbg) 70%, transparent) }
.tk-bat { width: 25px; height: 12px; border: 1.5px solid var(--pink); border-radius: 4px; position: relative; opacity: .8 }
.tk-bat::after { content: ""; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 70%; background: var(--pink); border-radius: 2px }
.tk-scr { overflow-y: auto; overflow-x: hidden; scrollbar-width: none }
.tk-scr::-webkit-scrollbar { display: none }
.tk-page { position: absolute; inset: 0; padding: 46px 16px 110px }
.tk-sp { flex: 1 }
.tk-dim { color: var(--pmuted) }
svg.tkg { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }

/* Today */
.tk-list { display: flex; flex-direction: column; gap: 10px }
.tk-card { position: relative; display: flex; align-items: center; gap: 12px; border-radius: 20px; padding: 11px 14px; box-shadow: 0 2px 5px var(--tkshadow); cursor: pointer; background: color-mix(in oklab, var(--hc) 17%, var(--pcard)); transition: transform .15s }
.tk-card.zoned { padding-bottom: 25px }
.tk-card.arm-g { outline: 2.5px solid var(--gr); transform: translateX(46px) }
.tk-card.drop { outline: 2px solid var(--ac) }
.tk-ringw { position: relative; width: 56px; height: 56px; display: grid; place-items: center; flex: none }
.tk-ring { position: absolute; inset: 0; width: 56px; height: 56px }
.tk-circle { position: relative; width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--hc); background: none; display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--hc) }
.tk-circle.on { background: var(--hc); color: #fff; box-shadow: 0 3px 4px rgba(0,0,0,.12) }
.tk-circle svg { stroke-width: 2.1 }
.tk-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px }
.tk-name { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--pink); white-space: nowrap; min-width: 0 }
.tk-name > span { overflow: hidden; text-overflow: ellipsis }
.tk-name svg { color: var(--hc) }
.tk-part { color: var(--pmuted); font-weight: 700; cursor: pointer; padding: 0 1px; border-radius: 6px }
.tk-part.pd { color: var(--hc); font-weight: 800 }
.tk-sep { font-style: normal; color: var(--pmuted); opacity: .5; padding: 0 4px }
.tk-ndot { width: 8px; height: 8px; border-radius: 50%; background: var(--hc); box-shadow: 0 0 0 3px color-mix(in oklab, var(--hc) 25%, transparent); margin: 0 6px; flex: none }
.tk-dots { display: flex; gap: 5px }
.tk-dot { display: grid; place-items: center; border-radius: 50%; background: var(--pline); color: var(--pmuted); font-style: normal; font-weight: 700 }
.tk-dot.on { background: var(--hc); color: #fff }
.tk-dot.sk { background: none; border: 1.5px solid var(--hc); color: var(--hc); opacity: .75 }
.tk-stat { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 70px }
.tk-num { font-size: 22px; font-weight: 800; letter-spacing: -.5px; font-variant-numeric: tabular-nums; line-height: 1.1; display: flex; align-items: center; gap: 3px }
.tk-lab { font-size: 10.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--pmuted); line-height: 1.2; white-space: pre-line }
.tk-wk { display: flex; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 700; color: var(--pmuted); opacity: .85 }
.tk-zones { position: absolute; left: 14px; right: 14px; bottom: 6px; display: flex; gap: 12px; font-size: 8.5px; font-weight: 700; letter-spacing: .9px; color: var(--pmuted); opacity: .85; pointer-events: none }
.tk-zones span:first-child { width: 56px; text-align: center }
.tk-zones span:nth-child(2) { flex: 1 }
.tk-lbs { display: flex; flex-direction: column; gap: 8px; margin-top: 16px }
.tk-lb { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid var(--pline); border-radius: 14px; background: var(--pcard); box-shadow: 0 2px 5px var(--tkshadow); font-weight: 700; font-size: 15px; color: var(--pink); cursor: pointer; text-align: left }
.tk-lb svg:first-child { color: var(--ac) }
.tk-lb svg:last-child { color: var(--pmuted); margin-left: auto }
.tk-float { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; display: flex; gap: 8px; padding: 6px 10px; background: var(--pcard); border-radius: 999px; box-shadow: 0 6px 12px rgba(0,0,0,.18); z-index: 30 }
.tk-fb { width: 62px; height: 44px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 10px; font-weight: 600; color: var(--pmuted); cursor: pointer; padding: 0 }
.tk-fb svg { width: 21px; height: 21px; color: var(--pink) }
.tk-toast { position: absolute; left: 16px; right: 16px; bottom: 92px; z-index: 90; display: flex; align-items: center; justify-content: center; gap: 14px; background: var(--pink); color: var(--pbg); padding: 12px 18px; border-radius: 999px; font-weight: 600; font-size: 14.5px; box-shadow: 0 4px 12px rgba(0,0,0,.18) }
.tk-toast button { border: 0; background: none; color: var(--tkundo); font-weight: 800; font-size: 14.5px; cursor: pointer; padding: 0 }

/* Pages */
.tk-top { display: flex; align-items: center; justify-content: space-between; min-height: 40px; margin-bottom: 2px }
.tk-back { display: flex; align-items: center; border: 0; background: none; color: var(--ac); font-size: 16px; padding: 4px 0; cursor: pointer; min-height: 40px }
.tk-back svg { width: 20px; height: 20px }
.tk-editb { display: flex; align-items: center; gap: 5px; border: 0; background: none; color: var(--ac); font-weight: 600; font-size: 16px; cursor: pointer }
.tk-editb svg { width: 16px; height: 16px }
.tk-ptitle { display: flex; align-items: center; gap: 8px; font-size: 32px; line-height: 1.1; font-weight: 800; margin: 2px 0 0 }
.tk-psub { color: var(--pmuted); font-size: 15px; font-weight: 500; margin: 2px 0 12px }
.tk-dc { background: var(--pcard); border-radius: 22px; padding: 16px; box-shadow: 0 2px 5px var(--tkshadow); margin-bottom: 14px }
.tk-dc h3 { font-size: 20px; font-weight: 800; margin: 0 0 8px; display: flex; align-items: center; gap: 8px }
.tk-calhd { display: flex; align-items: center; gap: 8px; margin-bottom: 4px }
.tk-calhd h3 { margin: 0; flex: 1 }
.tk-pill { display: flex; align-items: center; gap: 5px; border: 0; border-radius: 999px; padding: 0 10px; min-height: 34px; font-size: 13px; font-weight: 700; background: color-mix(in srgb, var(--ac) 12%, transparent); color: var(--ac); cursor: pointer }
.tk-pill svg { width: 15px; height: 15px }
.tk-pill.on { background: var(--ac); color: #fff }
.tk-chev { width: 34px; height: 34px; border: 0; border-radius: 50%; background: color-mix(in srgb, var(--ac) 12%, transparent); color: var(--ac); display: grid; place-items: center; cursor: pointer; padding: 0 }
.tk-chev svg { width: 16px; height: 16px }
.tk-hint { font-size: 13px; color: var(--pmuted); margin: 2px 0 8px }
.tk-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px }
.tk-wd { font-size: 11px; font-weight: 700; color: var(--pmuted); text-align: center }
.tk-cell { position: relative; aspect-ratio: 1; border-radius: 12px; border: 0; background: var(--pline); color: var(--pink); font: inherit; font-size: 14.5px; font-weight: 600; font-variant-numeric: tabular-nums; display: grid; place-items: center; padding: 0; cursor: pointer }
.tk-cell.dn { background: var(--hc); color: #fff }
.tk-cell.sk { background: none; border: 2px dashed var(--hc); color: var(--hc); opacity: .75 }
.tk-cell.fu { opacity: .45; cursor: default }
.tk-cell.fu.sk { opacity: .75 }
.tk-cell.td { box-shadow: inset 0 0 0 2px var(--hc) }
.tk-cell i { position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: currentColor }
.tk-tcell { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 54px; border: 0; background: none; padding: 0; font: inherit; cursor: pointer }
.tk-tcell > b { font-size: 11px; color: var(--pmuted) }
.tk-tcell.td > b { color: var(--pink) }
.tk-tc { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums }
.tk-tc.met { background: var(--gr); color: #fff }
.tk-tc.und { background: var(--pline); color: var(--pink) }
.tk-tc.run { background: var(--rd); color: #fff }
.tk-tc.emp { border: 1.5px solid var(--pline) }
.tk-tc.skp { border: 2px dashed var(--hc); color: var(--hc) }
.tk-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; font-weight: 600; color: var(--pmuted); margin-top: 8px }
.tk-legend span { display: flex; align-items: center; gap: 4px }
.tk-legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block }
.tk-vac { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 40px; margin-top: 10px; border: 2px dashed var(--pline); border-radius: 12px; background: none; color: var(--pmuted); font-weight: 600; font-size: 13px; cursor: pointer }
.tk-vac svg { width: 18px; height: 18px }
.tk-mnotes { border-top: 1px solid var(--pline); margin-top: 10px; padding-top: 8px; font-size: 14.5px }
.tk-mnotes b { color: var(--hc); margin-right: 8px }
.tk-yr { display: grid; grid-template-columns: repeat(32, 1fr); gap: 2px }
.tk-yr i { aspect-ratio: 1; border-radius: 2px; background: var(--pline); display: block }
.tk-yr i.p { background: var(--hc) }
.tk-yr i.f { opacity: .35 }
.tk-yr em { font-style: normal; font-size: 7px; font-weight: 800; color: var(--pmuted); line-height: 1; display: grid; place-items: center }
.tk-row { display: flex; gap: 8px; font-size: 14.5px; padding: 2px 0 }
.tk-row span { color: var(--pmuted); font-weight: 500 }
.tk-row b { font-variant-numeric: tabular-nums }
.tk-acts { display: flex; flex-direction: column; gap: 10px }
.tk-ab { min-height: 46px; border: 1px solid var(--pline); border-radius: 14px; background: var(--pcard); color: var(--ac); font-weight: 600; font-size: 16px; cursor: pointer }
.tk-ab.red { border: 0; background: none; color: var(--dg) }
.tk-track { position: relative; display: flex; gap: 1px; height: 12px; margin: 14px 10px 4px }
.tk-track b { display: block; height: 100%; border-radius: 6px }
.tk-track u { position: absolute; top: -8px; width: 3px; height: 26px; border-radius: 2px; background: var(--pink) }
.tk-tl { display: flex; justify-content: space-between; margin: 0 10px 8px; font-size: 10px; font-weight: 700; color: var(--pmuted) }
.tk-stage { display: flex; gap: 8px; align-items: baseline; margin: 6px 0 }
.tk-stage i { width: 10px; height: 10px; border-radius: 50%; flex: none }
.tk-stage b { font-size: 14.5px }
.tk-stage small { display: block; color: var(--pmuted); font-size: 13px }
.tk-stage.faded { opacity: .55 }

/* Stats and Last week */
.tk-tiles { display: flex; gap: 8px; margin: 8px 0 }
.tk-tiles div { flex: 1; text-align: center; font-size: 20px; font-weight: 800; color: var(--hc); line-height: 1.2 }
.tk-tiles small { display: block; font-size: 10px; font-weight: 700; color: var(--pmuted); text-transform: uppercase }
.tk-30 { display: flex; gap: 2px }
.tk-30 i { flex: 1; aspect-ratio: 1; border-radius: 3px; background: var(--pline) }
.tk-30 i.p { background: var(--hc) }
.tk-rec { display: flex; align-items: center; gap: 5px; font-weight: 700; font-size: 14.5px; color: var(--hc); margin-bottom: 8px }
.tk-bars { display: flex; align-items: flex-end; gap: 8px; height: 90px; margin-top: 6px }
.tk-bars div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 11px; color: var(--pmuted) }
.tk-bars i { width: 100%; max-width: 26px; background: var(--ac); border-radius: 7px 7px 4px 4px; display: block }
.tk-sec { font-size: 20px; font-weight: 800; margin: 16px 0 6px }
.tk-sec small { display: block; font-size: 13px; font-weight: 500; color: var(--pmuted) }
.tk-note { background: var(--pcard); border-radius: 16px; padding: 12px 14px; box-shadow: 0 2px 5px var(--tkshadow); margin-bottom: 8px; font-size: 14.5px }
.tk-note b { font-weight: 800 }
.tk-note small { display: block; color: var(--pmuted); font-size: 13px; margin-top: 2px }
.tk-words p { margin: 0 0 10px; font-size: 16px; line-height: 1.45 }
.tk-outl { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border: 1px solid var(--pline); border-radius: 14px; background: var(--pcard); color: var(--ac); font-weight: 700; font-size: 15px; margin: 8px 0; cursor: pointer; width: 100% }
.tk-outl svg { width: 18px; height: 18px }

/* Sheets, dialogs */

function topBar(edit) { return `<div class="tk-top"><button class="tk-back" data-act="page-back" data-t="page-back">${ico('chevL', 20)}Back</button>${edit ? `<button class="tk-editb" data-act="soon">${ico('pen', 16)}Edit</button>` : ''}</div>`; }
function calHTML(h) {
  const isT = h.type === 'timer', c = h.cal || { done: [], skip: [], notes: [] };
  const lead = 6, cells = [];

    const fu = n > 26, td = n === 26;
    if (isT) {
      const sk = (S.fskip || []).includes(n);
      let cls = 'emp', txt = '';
      if (sk) { cls = 'skp'; txt = '\u2013'; } else if (n < 26 && FASTDAYS[n]) { cls = FASTDAYS[n] >= h.goal ? 'met' : 'und'; txt = FASTDAYS[n]; } else if (td && S.fast.mode === 'run') { cls = 'run'; txt = Math.floor(S.fast.h); }
      cells.push(`<button class="tk-tcell${td ? ' td' : ''}" style="--hc:${h.color}" data-act="soon"><b>${n}</b><span class="tk-tc ${cls}">${txt}</span></button>`);
    } else {
      const dn = c.done.includes(n) && !fu, sk = c.skip.includes(n) && !dn;
      const note = c.notes.includes(n);
      cells.push(`<button class="tk-cell${dn ? ' dn' : ''}${sk ? ' sk' : ''}${fu ? ' fu' : ''}${td ? ' td' : ''}" data-act="${fu && !sk ? 'none' : 'cal-day'}" data-id="${n}" data-t="day-${n}">${n}${note ? '<i></i>' : ''}</button>`);
    }
  }
  const hint = S.noteMode ? 'Note mode: tap a day to write or edit its note.' : isT ? 'Tap a day to record a forgotten fast (0 = skip day) or to edit a recorded one.' : 'Tap a day to cycle: done \u2192 skip day \u2192 empty.';
  const legend = isT ? `<div class="tk-legend"><span><i style="background:var(--gr)"></i>goal met</span><span><i style="background:var(--pline)"></i>fell short</span><span><i style="background:var(--rd)"></i>running</span><span><i style="border:1.5px dashed var(--hc)"></i>skip day</span></div>` : '';
  const notes = (c.notes || []).sort((a, b) => a - b).map(n => `<div><b>${n}</b>${esc((c.noteText || {})[n] || 'travel day')}</div>`).join('');
  return `<div class="tk-dc" data-t="cal">

      <button class="tk-chev" data-act="soon" aria-label="Previous month">${ico('chevL', 16)}</button><button class="tk-chev" data-act="soon" aria-label="Next month">${ico('chevR', 16)}</button></div>
    <p class="tk-hint">${hint}</p>
    <div class="tk-cal">${MON.map(l => `<span class="tk-wd">${l}</span>`).join('')}${cells.join('')}</div>${legend}

}
function stagesHTML(h) {

function yearHTML(h) {

    { kind: 'check', head: 'Quick check', text: 'Where do the written notes in Last week come from?', answers: ['Plain arithmetic on your own data, on your devices', 'An online assistant that reads your habits', 'Other people\u2019s habits'], right: 0, ok: 'Right. Nothing is sent anywhere, and every note names the figure it came from.' }

/* ---------- Tour engine (reusable) ---------- */
let ci = 0, si = 0, solved = false, targetOff = false;
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
let doneChapters = new Set(JSON.parse(store.get('trackingtour-done') || '[]'));

function emit(name, data) {
  const st = LESSONS[ci]?.steps[si]; if (!st || solved || st.kind !== 'try') return;
  if (st.on && st.on[name]) { markTarget(st.on[name]); }
  if ((st.wait === name || st.alt === name) && (!st.when || st.when(data))) succeed(st.ok);
}
function succeed(msg) {
  solved = true; targetOff = true; const fb = document.getElementById('fb'); if (fb) { fb.textContent = '\u2713 ' + msg; fb.className = 'feedback'; }
  const nx = document.getElementById('next'); if (nx) { nx.disabled = false; nx.focus({ preventScroll: true }); }
  markTarget();
}
let curTarget = null;
function markTarget(t) {
  if (t !== undefined) curTarget = t;
  document.querySelectorAll('.target').forEach(e => e.classList.remove('target'));
  if (!curTarget || targetOff) return;
  const q = n => document.querySelector(`#stage [data-t="${CSS.escape(n)}"]`);
  // If the thing to tap is out of sight (a stray tap closed a page), point at the way back to it.
  const first = LESSONS[ci] && LESSONS[ci].steps[si] && LESSONS[ci].steps[si].target;
  const el = q(curTarget) || (first && first !== curTarget ? q(first) : null)
    || (S.alert ? q('alert-cancel') : S.sheet === 'settings' && S.spage ? q('page-back') : S.sheet ? q('sheet-cancel') : S.stack.length ? q('page-back') : null);
  if (el) {
    el.classList.add('target');
    const sc = el.closest('.tk-scr');
    if (sc) { const r = el.getBoundingClientRect(), s = sc.getBoundingClientRect(), k = document.getElementById('stagebox').clientWidth / 390;
      if (r.top < s.top + 40 * k || r.bottom > s.bottom - 110 * k) sc.scrollTop += (r.top - s.top - 120 * k) / k; }
  }
}
function renderRail() {
  const total = LESSONS.reduce((n, l) => n + l.steps.length, 0);
  const before = LESSONS.slice(0, ci).reduce((n, l) => n + l.steps.length, 0) + si;
  document.getElementById('rail').innerHTML = `<div class="brand"><span class="logo">${icon('grid')}</span><div><h1>Tracking Tour</h1><small>Written for AMS Tracking 2.0</small></div></div>
    ${LESSONS.map((l, i) => `<button class="chap ${i === ci ? 'cur' : ''} ${doneChapters.has(i) ? 'done' : ''}" data-ch="${i}">${icon(l.icon)}<span>${l.title}</span><span class="n">${doneChapters.has(i) ? '\u2713' : l.steps.length + ' steps'}</span></button>`).join('')}
    <button class="chap ${ci === LESSONS.length ? 'cur' : ''}" data-ch="${LESSONS.length}">${icon('phone')}<span>Now on your iPhone</span></button>
    <div class="bar"><i style="width:${Math.round(100 * Math.min(before, total) / total)}%"></i></div>
    <p class="railnote">Practice copy, nothing changes in your real app. Based on AMS Tracking 2.0 (build 24).</p>`;
}
document.getElementById('rail').addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (b) goChapter(+b.dataset.ch); });

function goChapter(i) {
  ci = i; si = 0; clearTimers(); S = START();
  const L = LESSONS[i]; if (L && L.setup) L.setup();
  renderStep();
}
function renderStep() {
  renderRail();
  const coach = document.getElementById('coach'), fin = document.getElementById('finish');
  if (ci >= LESSONS.length) { renderFinish(); coach.hidden = true; return; }
  coach.hidden = false; fin.hidden = true;
  const L = LESSONS[ci], st = L.steps[si];
  solved = st.kind === 'look'; targetOff = false;
  clearTimers(); clearTimeout(toastH);
  if (st.setup) st.setup();
  S.toast = null;
  const kindName = { look: 'Look', try: 'Try it', check: 'Check' }[st.kind];
  coach.innerHTML = `<div class="eyebrow">${icon(L.icon)} ${esc(L.title)} <span class="kind">\u00B7 ${kindName} \u00B7 step ${si + 1} of ${L.steps.length}</span></div>
    <div><h2>${esc(st.head)}</h2><p>${esc(st.text)}</p>${st.hint ? `<p style="color:var(--muted);font-size:13px">${esc(st.hint)}</p>` : ''}</div>
    <div class="btns">${ci + si > 0 ? '<button class="btn ghost" id="back">Back</button>' : ''}<button class="btn main-b" id="next" ${solved ? '' : 'disabled'}>${si === L.steps.length - 1 ? 'Finish chapter' : 'Next'}</button></div>
    ${st.kind === 'check' ? `<div class="answers">${st.answers.map((a, i) => `<button class="ans" data-a="${i}">${esc(a)}</button>`).join('')}</div>` : ''}
    <p class="feedback" id="fb"></p>`;
  curTarget = st.target || null;
  renderStage();
  if (st.kind === 'check') coach.querySelectorAll('.ans').forEach(b => b.onclick = () => {
    const fb = document.getElementById('fb');
    if (+b.dataset.a === st.right) { coach.querySelectorAll('.ans').forEach(x => x.disabled = true); b.classList.add('right'); succeed(st.ok); }
    else { b.classList.add('wrong'); fb.textContent = 'Not quite. Try another answer.'; fb.className = 'feedback no'; }
  });
  document.getElementById('next').onclick = next;
  const bk = document.getElementById('back'); if (bk) bk.onclick = back;
}
function next() {
  const L = LESSONS[ci];
  if (si < L.steps.length - 1) { si++; renderStep(); return; }
  doneChapters.add(ci); store.set('trackingtour-done', JSON.stringify([...doneChapters]));
  goChapter(ci + 1);
}
function back() { if (si > 0) { si--; renderStep(); } else if (ci > 0) { goChapter(ci - 1); } }

function renderFinish() {
  const fin = document.getElementById('finish'); fin.hidden = false;
  clearTimers(); S = START(); curTarget = null; renderStage();
  const items = ['Open Tracking on your iPhone. Today has no header. Tap the big circle of a habit, then tap it again to undo. Swipe a card right (done) and left (skip), and read the bar that appears.',
    'Press and hold the big circle of a habit you forgot yesterday. Read the bar: "Yesterday marked done". Then tap a part\u2019s word on a habit with parts, such as Walk | Read | Write.',
    'On the fasting card tap the round button and look at the ring. Tap the running time and look at Started, then press Cancel. Tap the middle of the card and find "Fasting stages".',
    'Open a habit\u2019s page. Tap a missed day to cycle it, tap Note, and look at "Skip several days (vacation)\u2026" (press Cancel).',
    'Tap Add, give it a name, choose Weekly target and press Save. Then open Stats and "Last week\u2019s analysis".',
    'Press and hold the Tracking icon on the Home Screen and look for Start Fasting or Stop Fasting. Say "Hey Siri, start fasting in Tracking". In Settings switch on the Daily reminder.',
    'In Settings check that State says "Up to date" under iCloud, open Safety copies, then open How it works and Signs in this app.'];
  let ticks = JSON.parse(store.get('trackingtour-real') || '[]');
  fin.innerHTML = `<h3>Now on your iPhone</h3><p style="margin:0 0 8px;color:var(--muted)">Everything here is a practice copy. Nothing changes on your iPhone, iPad or Mac. Now try the same things in the real app.</p>${items.map((t, i) => `<label><input type="checkbox" id="real-${i}" ${ticks.includes(i) ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn main-b" id="again">Start the tour again</button></div>`;
  fin.querySelectorAll('input').forEach((c, i) => c.onchange = () => { ticks = ticks.filter(x => x !== i); if (c.checked) ticks.push(i); store.set('trackingtour-real', JSON.stringify(ticks)); });
  document.getElementById('again').onclick = () => goChapter(0);
}

/* Fit the 390 x 760 pretend iPhone into its box */
function fit() { const box = document.getElementById('stagebox'); document.getElementById('stage').style.transform = `scale(${box.clientWidth / 390})`; }
new ResizeObserver(fit).observe(document.getElementById('stagebox'));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.alert) { S.alert = null; renderStage(); return; }
    if (S.sheet) { S.sheet = S.sheet === 'picker' ? 'settings' : null; if (S.sheet !== 'settings') S.spage = null; renderStage(); return; }
  }
  if (e.key === 'Enter' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') { const n = document.getElementById('next'); if (n && !n.disabled && document.activeElement !== n) n.click(); }
});
goChapter(0); fit();
</script>
