# XcodeGen spec — run tools/build.sh (it runs `xcodegen generate`), then open AMSTracking.xcodeproj.
# ONE target for iPhone, iPad and Mac. Native rebuild of the AMS Tracking web app (v1.51); iCloud Drive sync.
# It REUSES the App Store record of the Capacitor shell (app 6839502190, bundle io.github.marsch124.amstracking),
# so it replaces that app on Martin's phone from version 2.0 on.
name: AMSTracking
options:
  bundleIdPrefix: io.github.marsch124
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: D24ENP83QQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "24"
packages:
  # The shared AMS icon hub (SVG path reader), pinned to one commit so a hub change never arrives by surprise.
  AMSIcons:
    url: https://github.com/marsch124/AMS-Icons
    revision: 58433eb7ecfa08be37db25165069d14839ef13b4
targets:
  AMSTracking:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: AMSIcons
    entitlements:
      path: App/Config/AMSTracking.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.io.github.marsch124.amstracking]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.io.github.marsch124.amstracking]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.marsch124.amstracking
        PRODUCT_NAME: AMSTracking
        # iPhone AND iPad. iPad means all four orientations (upload error 90474).
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Config/Info.plist
      properties:
        CFBundleDisplayName: Tracking
        CFBundleName: AMS Tracking
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        # Lifestyle, NOT Food & Drink: with that category TestFlight refused every Mac install (Shopping, builds 1-4).
        LSApplicationCategoryType: public.app-category.lifestyle
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSUbiquitousContainers:
          iCloud.io.github.marsch124.amstracking:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: Tracking
            NSUbiquitousContainerSupportedFolderLevels: Any
  AMSTrackingTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
    dependencies:
      - target: AMSTracking
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.marsch124.amstracking.tests
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/AMSTracking.app/Contents/MacOS/AMSTracking
        "BUNDLE_LOADER[sdk=macosx*]": $(TEST_HOST)
  AMSTrackingUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: UITests
    dependencies:
      - target: AMSTracking
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.marsch124.amstracking.uitests
        TEST_TARGET_NAME: AMSTracking
schemes:
  AMSTracking:
    build:
      targets:
        AMSTracking: all
    test:
      targets:
        - AMSTrackingTests
        - AMSTrackingUITests
